<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ฝึกทำข้อสอบ | คลังข้อสอบ</title>
  <meta name="description" content="ฝึกทำข้อสอบ A-Level ออนไลน์ ทีละข้อ ตรวจคำตอบพร้อมคำอธิบายทันที">
  <link rel="icon" href="images/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Sarabun:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header id="site-header" class="site-header"></header>

  <main>
    <section class="page-hero page-hero-compact">
      <div class="container">
        <nav class="crumbs" aria-label="เส้นทาง">
          <a href="index.html">หน้าแรก</a>
          <span aria-hidden="true">/</span>
          <a href="subject.html" id="crumb-subject">วิชา</a>
          <span aria-hidden="true">/</span>
          <span>ฝึกทำออนไลน์</span>
        </nav>
        <h1 id="practice-title">ฝึกทำข้อสอบ</h1>
        <p class="lead">เลือกหัวข้อที่ต้องการก่อน แล้วทำโจทย์ได้ไม่จำกัดข้อ ตอบผิดก็ลองใหม่ได้เรื่อย ๆ</p>
      </div>
    </section>

    <section class="section container" id="setup-view">
      <form class="builder-panel practice-setup" id="filter-form" onsubmit="return false">
        <h2 class="setup-title">เลือกหัวข้อที่อยากฝึก</h2>
        <div class="field">
          <span class="field-label">แหล่งข้อสอบ</span>
          <div class="chip-group" id="source-group"></div>
        </div>

        <div class="field">
          <div class="field-label-row">
            <span class="field-label">หัวข้อ</span>
            <button type="button" class="link-btn" id="topic-all">เลือกทั้งหมด</button>
          </div>
          <div class="chip-group" id="topic-group"></div>
        </div>

        <div class="field">
          <span class="field-label">ช่วงปี</span>
          <div class="range-row">
            <select id="year-from" aria-label="ตั้งแต่ปี"></select>
            <span>ถึง</span>
            <select id="year-to" aria-label="ถึงปี"></select>
          </div>
        </div>

        <div class="field">
          <label class="switch">
            <input type="checkbox" id="hide-solved">
            <span class="switch-ui" aria-hidden="true"></span>
            <span>ซ่อนข้อที่ทำถูกแล้ว</span>
          </label>
        </div>

        <div class="setup-footer">
          <p class="muted" id="match-count" aria-live="polite">กำลังโหลด…</p>
          <button type="button" class="btn btn-primary" id="start-btn" disabled>เริ่มทำโจทย์</button>
        </div>
      </form>
    </section>

    <section class="section container" id="solve-view" hidden>
      <div class="practice-shell">
        <div class="practice-stats" id="practice-stats" aria-live="polite"></div>
        <div id="practice-stage">
          <div class="skeleton-card practice-skeleton"></div>
        </div>
      </div>
    </section>
  </main>

  <footer id="site-footer" class="site-footer"></footer>

  <script defer src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.js"></script>
  <script defer src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/contrib/auto-render.min.js"></script>
  <script defer src="js/data.js"></script>
  <script defer src="js/common.js"></script>
  <script defer src="js/practice.js"></script>
</body>
</html>
